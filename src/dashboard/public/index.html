<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#5865f2" />
    <title>Rumbleverse Revival: Discord bot and dashboard</title>
    <meta
      name="description"
      content="The all-in-one Discord bot for the Rumbleverse Revival community. Moderation, automod, tickets, leveling and more, all set up from one dashboard."
    />
    <!-- Link previews in Discord and elsewhere. The server fills in %BASE_URL%. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rumbleverse Revival" />
    <meta property="og:title" content="Rumbleverse Revival" />
    <meta
      property="og:description"
      content="The all-in-one Discord bot for the Rumbleverse Revival community. Moderation, automod, tickets, leveling and more, all set up from one dashboard."
    />
    <meta property="og:url" content="%BASE_URL%/" />
    <meta property="og:image" content="%BASE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rumbleverse Revival: the all-in-one Discord bot" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <!-- Fetched at once instead of after app.js has loaded. -->
    <link rel="modulepreload" href="guide.js" />
    <link rel="preload" href="locales/en.json" as="fetch" crossorigin="anonymous" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <button id="menuToggle" class="icon-button nav-toggle" type="button" aria-label="Menu"></button>
      <a class="brand" href="#/">
        <img src="favicon.svg" alt="" width="28" height="28" />
        <span>Rumbleverse Revival</span>
      </a>
      <button id="searchButton" class="search-button" type="button" hidden></button>
      <div class="topbar-right"><div id="account"></div></div>
    </header>
    <main id="main" class="main" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
