<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Rumbleverse Revival Dashboard</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">
        <img src="favicon.svg" alt="" width="28" height="28" />
        <span>Rumbleverse Revival</span>
      </a>
      <div class="topbar-right">
        <button id="appearance" class="icon-button" type="button" aria-label="Appearance">🎨</button>
        <select id="language" class="language" aria-label="Language"></select>
        <div id="account"></div>
      </div>
    </header>
    <main id="main" class="main" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
