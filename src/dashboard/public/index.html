<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#7c5cff" />
    <!-- Title, description, canonical address and link preview tags for the
         page asked for. The server fills these in (src/dashboard/seo.js). -->
    <!--%META%-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css?v=%VERSION%" />
    <!-- Fetched at once instead of after app.js has loaded. -->
    <link rel="modulepreload" href="/guide.js" />
    <link rel="modulepreload" href="/guideCommands.js" />
    <link rel="modulepreload" href="/pageMeta.js" />
    <link rel="preload" href="/locales/en.json" as="fetch" crossorigin="anonymous" />
    <script type="module" src="/app.js?v=%VERSION%"></script>
  </head>
  <body>
    <header class="topbar">
      <button id="menuToggle" class="icon-button nav-toggle" type="button" aria-label="Menu"></button>
      <a class="brand" href="/">
        <img src="/favicon.svg" alt="" width="28" height="28" />
        <span>Rabble</span>
      </a>
      <nav id="topnav" class="topnav" hidden></nav>
      <button id="searchButton" class="search-button" type="button" hidden></button>
      <div class="topbar-right"><div id="account"></div></div>
    </header>
    <main id="main" class="main" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
